name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'

      - name: Vet
        run: go vet -tags "with_quic with_acme" ./...

      - name: Build
        run: go build -tags "with_quic with_acme" ./...

      - name: Test
        run: go test -race -tags "with_quic with_acme" ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --build-tags "with_quic with_acme"
